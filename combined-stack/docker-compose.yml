services:
  ev-charger-all-in-one:
    build: .
    container_name: ev-charger-all-in-one
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]  # 디버깅 끝나면 이 줄 지우세요
    environment:
      RUNNER_NAME: home-pc-runner
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/Murianwind/ev_charger_map
      ACCESS_TOKEN: "${ACCESS_TOKEN}"
      LABELS: self-hosted,home-pc
      RUNNER_WORKDIR: /tmp/runner/work
      EV_SERVICE_KEY: "${EV_SERVICE_KEY}"
    volumes:
      - runner-work:/tmp/runner/work
      - repo-data:/repo

volumes:
  runner-work:
  repo-data:
