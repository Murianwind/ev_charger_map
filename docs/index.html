<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전국 테슬라 충전 지도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="완속충전기" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  :root {
    --ink: #1c2320;
    --paper: #f6f5f1;
    --line: #d8d6cd;
    --available: #2f7d5a;
    --charging: #c98a2c;
    --other: #9a968a;
    --accent: #1c2320;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    z-index: 1000;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header .sub {
    font-size: 12px;
    color: #6b6a63;
    margin-top: 2px;
  }

  .filter-chip {
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 4px;
  }

  .filter-chip:hover {
    background: #e8e6df;
  }

  .filter-chip.active {
    background: var(--ink);
    color: #fff;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
  }

  .legend .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap
  }

  .legend .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }

  #status-bar {
    font-size: 12px;
    color: #6b6a63;
    padding: 4px 20px;
    border-bottom: 1px solid var(--line);
  }

  #last-updated {
    font-size: 11px;
    color: #9a968a;
    padding: 0 20px 4px;
    border-bottom: 1px solid var(--line);
  }

  #map {
    flex: 1;
  }

  .marker-dot {
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 1px 3px rgba(0,0,0,0.35);
  }

  .leaflet-popup-content-wrapper {
    border-radius: 8px;
  }

  .leaflet-popup-content {
    max-height: 55vh;
    overflow-y: auto;
    margin: 12px 16px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .leaflet-popup-close-button {
    font-size: 20px !important;
    padding: 8px !important;
    width: 30px !important;
    height: 30px !important;
  }

  .popup {
    font-size: 13px;
    line-height: 1.5;
    min-width: 240px;
    max-width: 300px;
  }

  .popup h3 {
    margin: 0 0 4px;
    font-size: 14px;
  }

  .popup .addr {
    color: #555;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .popup .location {
    color: #777;
    font-size: 12px;
    margin-top: -4px;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .popup .field {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 0;
    border-bottom: 1px dashed #e4e2d9;
  }

  .popup .field:last-of-type { border-bottom: none; }

  .popup .field .k { color: #777; flex-shrink: 0; }
  .popup .field .v { text-align: right; }

  .popup .chargers {
    margin-top: 8px;
    border-top: 1px solid var(--line);
    padding-top: 6px;
  }

  .popup .charger-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
  }

  .popup .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    color: #fff;
    flex-shrink: 0;
  }

  .popup .note {
    margin-top: 8px;
    padding: 6px 8px;
    background: #fbf3e1;
    border-radius: 6px;
    color: #7a5b12;
    font-size: 11.5px;
  }

  .tesla-badge {
    display: inline-block;
    margin-bottom: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #cc0000;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
  }

  .locate-btn {
    width: 40px;
    height: 40px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .locate-btn:hover { background: #f3f6ff; }
  .locate-btn:active { transform: translateY(1px); }

  .user-dot {
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35), 0 0 0 1px #fff;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>전국 테슬라 충전 지도</h1>
      <div class="sub" id="type-filter">
        <span class="filter-chip" data-type="02">AC완속</span> /
        <span class="filter-chip" data-type="09">NACS</span> /
        <span class="filter-chip" data-type="10">DC콤보+NACS</span> /
        <span class="filter-chip" data-type="TESLA">수퍼차저</span>
      </div>
    </div>
    <div class="legend">
      <span class="chip"><span class="dot" style="background:var(--available)"></span>충전가능</span>
      <span class="chip"><span class="dot" style="background:var(--charging)"></span>충전중</span>
      <span class="chip"><span class="dot" style="background:var(--other)"></span>충전불가</span>
      <span class="chip"><span class="dot" style="background:#fff;box-shadow:0 0 0 2px #cc0000"></span>수퍼차저</span>
    </div>
  </header>
  <div id="status-bar">불러오는 중...</div>
  <div id="last-updated"></div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const STATUS_COLOR = {
  "2": "#2f7d5a", // 충전가능
  "3": "#c98a2c", // 충전중
  DEFAULT: "#9a968a", // 통신이상 / 운영중지 / 점검중 / 알수없음
};

const RADIUS_KM = 5;
const MOVE_SETTLE_DELAY_MS = 1500; // 지도 이동이 끝난 뒤 이 시간만큼 더 기다렸다가 재표출
const DEFAULT_CENTER = [36.4, 127.9];
const DEFAULT_ZOOM = 7;

const map = L.map("map", { zoomControl: true }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);

L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19,
}).addTo(map);

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
});
map.addLayer(clusterGroup);

let allFeatures = [];
let dataLoaded = false;
let moveEndTimer = null;
let popupOpen = false;
const MAX_MARKERS = 1500; // 한 번에 그리는 마커 최대 개수 (성능 보호용 캡)
const POPUP_MAX_WIDTH = Math.max(220, Math.min(280, window.innerWidth - 40));

// 헤더의 AC완속/NACS/DC콤보+NACS/수퍼차저 칩 필터. 여러 개 선택하면
// 그중 하나라도 해당하는 충전소를 전부 표시한다(합집합). 아무것도
// 선택 안 하면(기본값) 전체를 표시한다.
const activeTypeFilters = new Set();

function stationMatchesTypeFilter(feature) {
  if (activeTypeFilters.size === 0) return true;
  const props = feature.properties;
  if (activeTypeFilters.has("TESLA") && props.isTesla) return true;
  return (props.chargers || []).some((c) => activeTypeFilters.has(c.chgerType));
}

// center를 기준으로, 화면의 짧은 변에 반경 원이 어느 정도 차도록 줌 레벨을 계산한다.
// map.getSize()는 레이아웃이 아직 안정되기 전에 부르면 엉뚱한(때로는 0에 가까운)
// 값을 반환할 수 있어, 먼저 invalidateSize()로 강제로 다시 계산시킨다.
// 가로/세로 중 "짧은 변" 기준으로 계산해야 가로로 넓은 데스크톱과 세로로 긴
// 모바일 양쪽 다 반경 원이 화면 밖으로 넘치지 않는다.
function zoomForRadius(center, radiusKm) {
  map.invalidateSize();
  const size = map.getSize(); // {x: 너비, y: 높이} px
  const shortSidePx = Math.min(size.x, size.y);

  if (!shortSidePx || shortSidePx < 50) {
    // 아직 레이아웃이 안 잡혀 크기를 못 믿을 상황: 무리하게 확대/축소하지 말고
    // 도시 단위로 보이는 무난한 기본 줌으로 대체한다.
    return 10;
  }

  const desiredPixelRadius = shortSidePx * 0.5; // 반경 원이 화면 짧은 변의 ~84%를 채우도록
  const metersPerPixel = (radiusKm * 1000) / desiredPixelRadius;
  const zoom =
    Math.log2((156543.03392 * Math.cos((center.lat * Math.PI) / 180)) / metersPerPixel);
  return Math.max(5, Math.min(16, zoom));
}

function stationColor(chargers) {
  const stats = chargers.map((c) => c.stat);
  if (stats.includes("2")) return STATUS_COLOR["2"];
  if (stats.includes("3")) return STATUS_COLOR["3"];
  return STATUS_COLOR.DEFAULT;
}

function escapeHtml(str) {
  if (str === undefined || str === null || str === "") return "-";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function floorLabel(props) {
  const type = props.floorType === "B" ? "지하" : props.floorType === "F" ? "지상" : "";
  if (!type) return "-";
  const num = props.floorNum ? `${props.floorNum}층` : "";
  return `${type} ${num}`.trim();
}

function buildPopup(props) {
  // addr/addrDetail을 합칠 때, escapeHtml()의 "빈 값이면 -로 표시" 규칙을
  // 그대로 쓰면 addrDetail이 빈 문자열일 때 주소 뒤에 의미 없는 "-"가
  // 붙는다. 여기선 있는 것만 이어붙인다.
  const addrLine = [props.addr, props.addrDetail]
    .filter((part) => part && part.trim())
    .map(escapeHtml)
    .join(" ");

  const teslaBadge = props.isTesla
    ? `<div class="tesla-badge">⚡ 테슬라 슈퍼차저</div>`
    : "";

  if (props.isTesla) {
    // supercharge.info는 실시간 사용 가능 여부를 제공하지 않아서,
    // 개별 커넥터 상태를 지어내지 않고 요약 정보만 보여준다.
    return `
      <div class="popup">
        ${teslaBadge}
        <h3>${escapeHtml(props.statNm)}</h3>
        <div class="addr">${addrLine}</div>
        <div class="field"><span class="k">이용시간</span><span class="v">${escapeHtml(props.useTime)}</span></div>
        <div class="note">충전기 상태 정보 미제공</div>
        <div class="field"><span class="k">${escapeHtml(props.teslaSummary)}</span></div>
      </div>`;
  }

  const chargerRows = props.chargers
    .map((c) => {
      const color = STATUS_COLOR[c.stat] || STATUS_COLOR.DEFAULT;
      return `
        <div class="charger-row">
          <span>${escapeHtml(c.chgerTypeName)}${c.output ? ` (${escapeHtml(c.output)}kW)` : ""}</span>
          <span class="badge" style="background:${color}">${escapeHtml(c.statName)}</span>
        </div>`;
    })
    .join("");

  // limitYn=N으로 필터링된 항목이라도 limitDetail에 값이 남아있는 경우,
  // 추후 필터 조건 보강을 위해 그대로 노출한다.
  const limitNote = props.limitDetail
    ? `<div class="note">이용제한 사유(참고): ${escapeHtml(props.limitDetail)}</div>`
    : "";

  const limitLabel =
    props.limitYn === "N" ? "없음" : props.limitYn === "Y" ? "있음" : "확인 필요";
  const parkingLabel =
    props.parkingFree === "Y" ? "무료" : props.parkingFree === "N" ? "유료" : "확인 필요";

  // location은 addr에서 분리해낸 시설명(또는 API 자체 값)이라, 주소와
  // 별도 줄로 보여준다 (예: "전민동 제2공영주차장").
  const locationLine = props.location
    ? `<div class="location">${escapeHtml(props.location)}</div>`
    : "";

  return `
    <div class="popup">
      <h3>${escapeHtml(props.statNm)}</h3>
      <div class="addr">${addrLine}</div>
      ${locationLine}
      <div class="field"><span class="k">이용시간</span><span class="v">${escapeHtml(props.useTime)}</span></div>
      <div class="field"><span class="k">운영기관</span><span class="v">${escapeHtml(props.busiNm)}</span></div>
      <div class="field"><span class="k">이용자 제한</span><span class="v">${limitLabel}</span></div>
      <div class="field"><span class="k">주차료</span><span class="v">${parkingLabel}</span></div>
      <div class="field"><span class="k">지상/지하</span><span class="v">${floorLabel(props)}</span></div>
      <div class="chargers">${chargerRows}</div>
      ${limitNote}
    </div>`;
}

const statusBar = document.getElementById("status-bar");

function makeMarker(feature) {
  const [lng, lat] = feature.geometry.coordinates;
  const props = feature.properties;
  const color = stationColor(props.chargers);
  const marker = L.circleMarker([lat, lng], {
    radius: 7,
    fillColor: color,
    color: props.isTesla ? "#cc0000" : "#fff",
    weight: props.isTesla ? 2.5 : 1.5,
    fillOpacity: 0.95,
    className: "marker-dot",
  });
  marker.bindPopup(buildPopup(props), {
    maxWidth: POPUP_MAX_WIDTH,
    maxHeight: Math.round(window.innerHeight * 0.55),
    autoPan: true,
    autoPanPadding: [16, 16],
    closeButton: true,
  });
  return marker;
}

// 현재 지도 화면(뷰포트) 안에 들어오는 충전소만 걸러 다시 그린다.
// 너무 많으면(MAX_MARKERS 초과) 성능 보호를 위해 앞부분만 그리고 안내 문구를 보여준다.
function renderVisible() {
  const bounds = map.getBounds();
  const withinBounds = allFeatures.filter((f) => {
    const [lng, lat] = f.geometry.coordinates;
    return bounds.contains([lat, lng]) && stationMatchesTypeFilter(f);
  });

  const capped = withinBounds.length > MAX_MARKERS;
  const toRender = capped ? withinBounds.slice(0, MAX_MARKERS) : withinBounds;

  clusterGroup.clearLayers();
  clusterGroup.addLayers(toRender.map(makeMarker));

  statusBar.textContent = capped
    ? `현재 화면에 ${withinBounds.length.toLocaleString()}개소 중 ${MAX_MARKERS.toLocaleString()}개만 표시 중 — 더 확대해 보세요`
    : `현재 화면 내 충전소 ${withinBounds.length.toLocaleString()}개소 표시 중`;
}

// 팝업이 열려있는 동안은 재렌더링(=마커 전체 재생성)을 하지 않는다.
// 안 그러면 팝업을 열 때 발생하는 autoPan → moveend 때문에, 보고 있던
// 팝업의 마커가 통째로 새로 만들어지면서 팝업이 저절로 닫혀버린다.
map.on("popupopen", () => {
  popupOpen = true;
  if (moveEndTimer) clearTimeout(moveEndTimer);
});
map.on("popupclose", () => {
  popupOpen = false;
  renderVisible(); // 팝업 여는 동안 놓친 화면 변화가 있으면 이제 반영
});

// 사용자가 지도를 이동/확대·축소한 뒤, 동작이 완전히 끝나고 나서
// MOVE_SETTLE_DELAY_MS만큼 더 기다렸다가 현재 화면 기준으로 다시 표출한다.
map.on("moveend", () => {
  if (!dataLoaded || popupOpen) return;
  if (moveEndTimer) clearTimeout(moveEndTimer);
  moveEndTimer = setTimeout(renderVisible, MOVE_SETTLE_DELAY_MS);
});

let userLatLng = null;
let userMarker = null;
let radiusCircle = null;

// 현재 위치 마커 + 반경 안내 원을 표시(있으면 위치만 갱신)
function showUserLocation(center) {
  userLatLng = center;

  if (userMarker) {
    userMarker.setLatLng(center);
  } else {
    userMarker = L.circleMarker(center, {
      radius: 8,
      fillColor: "#2563eb",
      color: "#fff",
      weight: 2,
      fillOpacity: 1,
      className: "user-dot",
    }).addTo(map);
    userMarker.bindTooltip("현재 위치", { direction: "top", offset: [0, -8] });
  }

  if (radiusCircle) {
    radiusCircle.setLatLng(center);
  } else {
    radiusCircle = L.circle(center, {
      radius: RADIUS_KM * 1000,
      color: "#2563eb",
      weight: 1,
      fillOpacity: 0.04,
      dashArray: "4 6",
    }).addTo(map);
  }
}

// "현재 위치로 이동" 버튼 핸들러: 이미 위치를 알고 있으면 바로 이동,
// 모르면(아직 못 받았거나 최초 거부 후 다시 시도) 새로 요청한다.
function goToUserLocation() {
  if (userLatLng) {
    map.setView(userLatLng, zoomForRadius(userLatLng, RADIUS_KM));
    renderVisible();
  } else {
    requestLocation();
  }
}

function requestLocation() {
  if (!navigator.geolocation) {
    statusBar.textContent = "이 브라우저는 위치 정보를 지원하지 않습니다.";
    renderVisible();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const center = L.latLng(pos.coords.latitude, pos.coords.longitude);
      showUserLocation(center);
      map.setView(center, zoomForRadius(center, RADIUS_KM));
      renderVisible();
    },
    (err) => {
      console.warn("위치 정보를 가져오지 못했습니다:", err.message);
      statusBar.textContent = "위치 권한이 없어 현재 화면 기준으로 표시합니다.";
      renderVisible();
    },
    { timeout: 8000, maximumAge: 5 * 60 * 1000 }
  );
}

const LocateControl = L.Control.extend({
  options: { position: "bottomright" },
  onAdd: function () {
    const btn = L.DomUtil.create("button", "locate-btn");
    btn.type = "button";
    btn.title = "현재 위치로 이동";
    btn.innerHTML = "⦿";
    L.DomEvent.disableClickPropagation(btn);
    L.DomEvent.on(btn, "click", goToUserLocation);
    return btn;
  },
});
map.addControl(new LocateControl());

document.querySelectorAll(".filter-chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const type = chip.dataset.type;
    if (activeTypeFilters.has(type)) {
      activeTypeFilters.delete(type);
      chip.classList.remove("active");
    } else {
      activeTypeFilters.add(type);
      chip.classList.add("active");
    }
    if (dataLoaded) renderVisible();
  });
});

const lastUpdatedEl = document.getElementById("last-updated");

function formatKstTime(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleString("ko-KR", {
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function renderLastUpdated(meta) {
  if (!meta) {
    lastUpdatedEl.textContent = "";
    return;
  }
  const skipLabel = (status) => {
    if (status === "skipped_quota_exceeded") return " (한도초과로 건너뜀)";
    if (status === "skipped_suspicious_empty_result") return " (이상 응답으로 건너뜀)";
    return "";
  };
  const parts = [];
  const full = meta.lastFullUpdate;
  const status = meta.lastStatusUpdate;
  if (full) {
    parts.push(`지역갱신 ${formatKstTime(full.time)}${skipLabel(full.status)}`);
  }
  if (status) {
    parts.push(`상태갱신 ${formatKstTime(status.time)}${skipLabel(status.status)}`);
  }
  lastUpdatedEl.textContent = parts.join(" · ");
}

async function loadData() {
  statusBar.textContent = "불러오는 중...";
  try {
    const res = await fetch("data/chargers.geojson", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geojson = await res.json();

    allFeatures = geojson.features;
    dataLoaded = true;
    renderLastUpdated(geojson.meta);

    requestLocation();
  } catch (err) {
    console.error(err);
    statusBar.textContent = "데이터를 불러오지 못했습니다. data/chargers.geojson 파일을 확인해 주세요.";
  }
}

loadData();
</script>
