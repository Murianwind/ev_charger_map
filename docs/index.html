<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전국 테슬라 충전 지도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="완속충전기" />

<style>
  :root {
    --ink: #1c2320;
    --paper: #f6f5f1;
    --line: #d8d6cd;
    --available: #2f7d5a;
    --charging: #c98a2c;
    --other: #9a968a;
    --accent: #1c2320;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    z-index: 1000;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header .sub {
    font-size: 12px;
    color: #6b6a63;
    margin-top: 2px;
  }

  .filter-chip {
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 4px;
  }

  .filter-chip:hover {
    background: #e8e6df;
  }

  .filter-chip.active {
    background: var(--ink);
    color: #fff;
  }

  #searchBox {
    position: relative;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #searchInput {
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 220px;
    background: #fff;
  }
  #searchBtn {
    font-size: 13px;
    padding: 7px 12px;
    border: none;
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  #searchBtn:hover { opacity: 0.85; }

  #searchResults {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    max-height: 320px;
    overflow-y: auto;
    z-index: 50;
  }
  #searchResults.hidden { display: none; }

  .search-result-section-title {
    font-size: 11px;
    color: #9a968a;
    padding: 8px 12px 4px;
  }
  .search-result-item {
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid #f0efe9;
  }
  .search-result-item:hover { background: #f6f5f1; }
  .search-result-item .name { font-weight: 600; }
  .search-result-item .addr { font-size: 11px; color: #6b6a63; margin-top: 2px; }
  .search-result-empty { padding: 12px; font-size: 13px; color: #9a968a; text-align: center; }

  .legend {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 12px;
  }

  .legend .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap
  }

  .legend .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }

  #status-bar {
    font-size: 12px;
    color: #6b6a63;
    padding: 4px 20px;
    border-bottom: 1px solid var(--line);
  }

  #last-updated {
    font-size: 11px;
    color: #9a968a;
    padding: 0 20px 4px;
    border-bottom: 1px solid var(--line);
  }
  #last-updated.has-detail { cursor: pointer; }
  #last-updated.has-detail:hover { color: #6b6a63; }

  #regionUpdateDetail {
    font-size: 11px;
    color: #6b6a63;
    padding: 6px 20px;
    border-bottom: 1px solid var(--line);
    background: #faf9f5;
  }
  #regionUpdateDetail.hidden { display: none; }
  #regionUpdateDetail .region-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 2px 0;
  }

  #map {
    flex: 1;
    position: relative; /* locate-btn을 이 안에서 절대 위치로 띄우기 위함 */
  }

  .popup {
    font-size: 13px;
    line-height: 1.5;
    min-width: 240px;
    max-width: 300px;
    max-height: 55vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    padding: 12px 16px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .popup .popup-close {
    position: absolute;
    top: 6px;
    right: 8px;
    border: none;
    background: none;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    color: #888;
    padding: 4px;
  }

  .popup h3 {
    margin: 0 0 4px;
    font-size: 14px;
    padding-right: 20px;
  }

  .popup .addr {
    color: #555;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .popup .location {
    color: #777;
    font-size: 12px;
    margin-top: -4px;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .popup .field {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 0;
    border-bottom: 1px dashed #e4e2d9;
  }

  .popup .field:last-of-type { border-bottom: none; }

  .popup .field .k { color: #777; flex-shrink: 0; }
  .popup .field .v { text-align: right; }

  .popup .chargers {
    margin-top: 8px;
    border-top: 1px solid var(--line);
    padding-top: 6px;
  }

  .popup .charger-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
  }

  .popup .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    color: #fff;
    flex-shrink: 0;
  }

  .popup .note {
    margin-top: 8px;
    padding: 6px 8px;
    background: #fbf3e1;
    border-radius: 6px;
    color: #7a5b12;
    font-size: 11.5px;
  }

  .tesla-badge {
    display: inline-block;
    margin-bottom: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #cc0000;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
  }

  .locate-btn {
    position: absolute;
    right: 12px;
    bottom: 24px;
    z-index: 10;
    width: 40px;
    height: 40px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .locate-btn:hover { background: #f3f6ff; }
  .locate-btn:active { transform: translateY(1px); }

  .user-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35), 0 0 0 1px #fff;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>전국 테슬라 충전 지도</h1>
      <div class="sub" id="type-filter">
        <span class="filter-chip" data-type="02">AC완속</span> /
        <span class="filter-chip" data-type="09">NACS</span> /
        <span class="filter-chip" data-type="10">DC콤보+NACS</span> /
        <span class="filter-chip" data-type="TESLA">수퍼차저</span> /
        <span class="filter-chip" id="paid-parking-toggle">유료주차 포함</span> /
        <span class="filter-chip" id="show-closed-toggle">운영종료 포함</span>
      </div>
    </div>
    <div id="searchBox">
      <input type="text" id="searchInput" placeholder="주소 또는 충전소명 검색" autocomplete="off" />
      <button type="button" id="searchBtn">검색</button>
      <div id="searchResults" class="hidden"></div>
    </div>
    <div class="legend">
      <span class="chip"><span class="dot" style="background:var(--available)"></span>충전가능</span>
      <span class="chip"><span class="dot" style="background:var(--charging)"></span>충전중</span>
      <span class="chip"><span class="dot" style="background:var(--other)"></span>충전불가</span>
      <span class="chip"><span class="dot" style="background:#fff;box-shadow:0 0 0 2px #cc0000"></span>수퍼차저</span>
      <span class="chip"><span class="dot" style="background:#fff;box-shadow:0 0 0 2px #f59e0b"></span>유료주차</span>
      <span class="chip"><span class="dot" style="background:#fff;box-shadow:0 0 0 2px #6b7280"></span>운영종료</span>
    </div>
  </header>
  <div id="status-bar">불러오는 중...</div>
  <div id="last-updated"></div>
  <div id="regionUpdateDetail" class="hidden"></div>
  <div id="map"></div>
</div>

<!--
  카카오맵 JS 키 설정 필요:
  1. https://developers.kakao.com 에서 기존 앱 선택
  2. 앱 설정 → 플랫폼 → Web 플랫폼 등록 → 사이트 도메인에 https://murianwind.github.io 추가
  3. 제품 설정 → 지도(Maps) 활성화
  4. 앱 설정 → 앱 키 → "JavaScript 키" 복사해서 아래 appkey= 뒤에 붙여넣기
     (REST API 키랑 다른 키입니다 — 지오코딩용 키를 여기 쓰면 안 됩니다)
-->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=41a435402a9a232bd1d9804a4a795937&libraries=clusterer,services&autoload=false"></script>
<script>
const STATUS_COLOR = {
  "2": "#2f7d5a", // 충전가능
  "3": "#c98a2c", // 충전중
  DEFAULT: "#9a968a", // 통신이상 / 운영중지 / 점검중 / 알수없음
};

const RADIUS_KM = 1.5;
// "괴산"처럼 행정구역 이름만 검색했을 때 쓰는 넓은 확대 레벨(카카오 레벨,
// 숫자가 클수록 축소). 시/군 하나가 대략 화면에 들어오는 정도로 잡았다 —
// 실제로 써보고 너무 넓거나 좁으면 이 숫자만 조정하면 된다.
const REGION_VIEW_LEVEL = 9;
const MOVE_SETTLE_DELAY_MS = 800; // 지도 이동이 끝난 뒤 이 시간만큼 더 기다렸다가 재표출
const DEFAULT_CENTER = [36.4, 127.9];
// 카카오 지도는 레벨 숫자가 작을수록 확대(=Leaflet 줌과 반대 방향)이다.
// 13 정도가 전국이 대략 다 보이는 수준.
const DEFAULT_LEVEL = 13;
// 이 레벨보다 축소된(숫자가 큰) 상태에서만 클러스터링한다 — 이 값보다
// 확대하면(숫자가 작아지면) 클러스터링을 끄고 마커를 각자 그대로 찍는다.
const CLUSTER_MIN_LEVEL = 6;

const statusBar = document.getElementById("status-bar");
const lastUpdatedEl = document.getElementById("last-updated");

let map;
let clusterer;
let infoWindow; // 팝업 하나를 계속 재사용한다(마커마다 새로 안 만듦)
let popupOpen = false;
// 지금 열려있는 팝업이 어느 좌표에 붙어있는지 기억해둔다 — 지도가 멈출
// 때마다 이 좌표가 아직 화면(뷰포트) 안에 있는지 확인해서, 벗어났으면
// 팝업을 자동으로 닫아준다(사용자가 깜빡하고 안 닫아도 지도가 계속 멈춰있지
// 않게).
let openPopupLatLng = null;

let allFeatures = [];
let dataLoaded = false;
let moveEndTimer = null;
const MAX_MARKERS = 1500; // 한 번에 그리는 마커 최대 개수 (성능 보호용 캡)
const POPUP_MAX_WIDTH = Math.max(220, Math.min(280, window.innerWidth - 40));

// 헤더의 AC완속/NACS/DC콤보+NACS/수퍼차저 칩 필터. 여러 개 선택하면
// 그중 하나라도 해당하는 충전소를 전부 표시한다(합집합). 아무것도
// 선택 안 하면(기본값) 전체를 표시한다.
const activeTypeFilters = new Set();

function stationMatchesTypeFilter(feature) {
  if (activeTypeFilters.size === 0) return true;
  const props = feature.properties;
  if (activeTypeFilters.has("TESLA") && props.isTesla) return true;
  return (props.chargers || []).some((c) => activeTypeFilters.has(c.chgerType));
}

// 기본값(꺼짐): 무료 주차만 표시. 켜면 유료주차 충전소도 같이 보여준다.
// parkingFree가 "Y"가 아닌 경우(유료 또는 확인 필요) 전부 "유료주차 포함"
// 토글 대상으로 묶는다 — 정보가 불확실한 것도 무조건 숨기기보다는, 켜면
// 볼 수 있게 해두는 쪽이 안전하다.
let showPaidParking = false;

function stationMatchesParkingFilter(feature) {
  if (showPaidParking) return true;
  const props = feature.properties;
  if (props.isTesla) return true; // 테슬라는 parkingFree 개념이 없음(정보 자체가 없음)
  return props.parkingFree === "Y";
}

// 기본값(꺼짐): 지금 시각 기준으로 운영시간이 아닌 곳은 자동으로 숨긴다.
// 켜면(운영종료 포함) 그런 곳도 같이 보여준다. hours.kind가
// "unknown"(파싱 실패/정보 없음)이면 판단할 근거가 없으니 안전하게 항상 표시한다.
let showClosedStations = false;

// start/end는 자정 기준 분(0~1439). start > end면 자정을 넘기는(익일까지)
// 운영시간으로 보고 감싸서 비교한다(예: 22:00~06:00).
function isWithinRange(nowMinutes, start, end) {
  if (start === end) return true;
  if (start < end) return nowMinutes >= start && nowMinutes < end;
  return nowMinutes >= start || nowMinutes < end;
}

function isOpenNow(hours) {
  if (!hours || hours.kind === "always" || hours.kind === "unknown") return true;

  const now = new Date();
  const isWeekend = now.getDay() === 0 || now.getDay() === 6; // 0=일, 6=토
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  if (hours.kind === "daily") {
    return isWithinRange(nowMinutes, hours.start, hours.end);
  }
  if (hours.kind === "weekday_only") {
    if (isWeekend) return false; // 주말 언급이 없는 평일 전용은 주말엔 숨긴다
    return isWithinRange(nowMinutes, hours.start, hours.end);
  }
  if (hours.kind === "weekday_weekend") {
    return isWeekend
      ? isWithinRange(nowMinutes, hours.weekendStart, hours.weekendEnd)
      : isWithinRange(nowMinutes, hours.start, hours.end);
  }
  return true;
}

function stationMatchesHoursFilter(feature) {
  if (showClosedStations) return true; // 운영종료 포함 켜짐 -> 필터 안 함
  return isOpenNow(feature.properties.hours); // 기본값 -> 지금 운영중인 곳만
}

function stationColor(chargers) {
  const stats = chargers.map((c) => c.stat);
  if (stats.includes("2")) return STATUS_COLOR["2"];
  if (stats.includes("3")) return STATUS_COLOR["3"];
  return STATUS_COLOR.DEFAULT;
}

function escapeHtml(str) {
  if (str === undefined || str === null || str === "") return "-";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function floorLabel(props) {
  const type = props.floorType === "B" ? "지하" : props.floorType === "F" ? "지상" : "";
  if (!type) return "-";
  const num = props.floorNum ? `${props.floorNum}층` : "";
  return `${type} ${num}`.trim();
}

function buildPopup(props) {
  // addr는 저희가 정리한 깨끗한 주소만 담고 있지만, addrDetail은 API 원본
  // 그대로라 "지하1층" 같은 짧은 정보뿐 아니라 "청주시 평생학습관"처럼
  // 시설명 전체가 들어있는 경우도 많다. 그래서 addrDetail을 주소 줄에
  // 붙이지 않고, location(우리가 추출한 시설명)과 같은 줄로 보낸다.
  const addrLine = escapeHtml(props.addr);

  // addrDetail과 location이 API 원본 그대로 완전히 같은 문자열인 경우가
  // 많다(둘 다 그냥 "주차장"인 식). 그대로 이어붙이면 "주차장 주차장"처럼
  // 중복되니, 정확히 같은 문자열이면 한 번만 남긴다.
  const locationParts = [props.addrDetail, props.location]
    .map((part) => (part || "").trim())
    .filter(Boolean);
  const uniqueLocationParts = [...new Set(locationParts)];
  const locationText = uniqueLocationParts.join(" ");
  const locationLine = locationText ? `<div class="location">${escapeHtml(locationText)}</div>` : "";

  const teslaBadge = props.isTesla
    ? `<div class="tesla-badge">⚡ 테슬라 슈퍼차저</div>`
    : "";

  const closeBtn = `<button type="button" class="popup-close" onclick="closePopup()">✕</button>`;

  if (props.isTesla) {
    // supercharge.info는 실시간 사용 가능 여부를 제공하지 않아서,
    // 개별 커넥터 상태를 지어내지 않고 요약 정보만 보여준다.
    return `
      <div class="popup" style="position:relative;">
        ${closeBtn}
        ${teslaBadge}
        <h3>${escapeHtml(props.statNm)}</h3>
        <div class="addr">${addrLine}</div>
        ${locationLine}
        <div class="field"><span class="k">이용시간</span><span class="v">${escapeHtml(props.useTime)}</span></div>
        <div class="note">충전기 상태 정보 미제공</div>
        <div class="field"><span class="k">${escapeHtml(props.teslaSummary)}</span></div>
      </div>`;
  }

  const chargerRows = props.chargers
    .map((c) => {
      const color = STATUS_COLOR[c.stat] || STATUS_COLOR.DEFAULT;
      return `
        <div class="charger-row">
          <span>${escapeHtml(c.chgerTypeName)}${c.output ? ` (${escapeHtml(c.output)}kW)` : ""}</span>
          <span class="badge" style="background:${color}">${escapeHtml(c.statName)}</span>
        </div>`;
    })
    .join("");

  // limitYn=N으로 필터링된 항목이라도 limitDetail에 값이 남아있는 경우,
  // 추후 필터 조건 보강을 위해 그대로 노출한다.
  const limitNote = props.limitDetail
    ? `<div class="note">이용제한 사유(참고): ${escapeHtml(props.limitDetail)}</div>`
    : "";

  const limitLabel =
    props.limitYn === "N" ? "없음" : props.limitYn === "Y" ? "있음" : "확인 필요";
  const parkingLabel =
    props.parkingFree === "Y" ? "무료" : props.parkingFree === "N" ? "유료" : "확인 필요";

  return `
    <div class="popup" style="position:relative;">
      ${closeBtn}
      <h3>${escapeHtml(props.statNm)}</h3>
      <div class="addr">${addrLine}</div>
      ${locationLine}
      <div class="field"><span class="k">이용시간</span><span class="v">${escapeHtml(props.useTime)}</span></div>
      <div class="field"><span class="k">운영기관</span><span class="v">${escapeHtml(props.busiNm)}</span></div>
      <div class="field"><span class="k">이용자 제한</span><span class="v">${limitLabel}</span></div>
      <div class="field"><span class="k">주차료</span><span class="v">${parkingLabel}</span></div>
      <div class="field"><span class="k">지상/지하</span><span class="v">${floorLabel(props)}</span></div>
      <div class="chargers">${chargerRows}</div>
      ${limitNote}
    </div>`;
}

// 색깔 원 마커 이미지를 SVG로 만든다. 테두리 색으로 "왜 이 상태로 보이는지"를
// 나타낸다 — 채우기 색(충전 상태)은 그대로 두고, 테두리만 구분한다:
// 흰색=기본, 빨강=테슬라, 회색=지금 운영종료(토글로 보이는 중), 주황=유료주차
// (토글로 보이는 중). 운영종료+유료가 둘 다 해당하면 운영종료를 우선한다.
const markerImageCache = new Map();

const MARKER_BORDER_STYLES = {
  tesla: { color: "#cc0000", width: 2 },
  closed: { color: "#6b7280", width: 2 },
  paid: { color: "#f59e0b", width: 2 },
  normal: { color: "#ffffff", width: 1.5 },
};

function getMarkerImage(fillColor, borderKind) {
  const style = MARKER_BORDER_STYLES[borderKind] || MARKER_BORDER_STYLES.normal;
  const size = 12;
  const key = `${fillColor}|${style.color}|${style.width}`;
  if (markerImageCache.has(key)) return markerImageCache.get(key);

  const r = size / 2 - style.width / 2;
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">` +
    `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="${fillColor}" ` +
    `stroke="${style.color}" stroke-width="${style.width}" ` +
    `style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));" /></svg>`;
  const dataUri = "data:image/svg+xml;base64," + btoa(svg);
  const image = new kakao.maps.MarkerImage(
    dataUri,
    new kakao.maps.Size(size, size),
    { offset: new kakao.maps.Point(size / 2, size / 2) }
  );
  markerImageCache.set(key, image);
  return image;
}

function openPopupFor(marker, props) {
  infoWindow.setContent(buildPopup(props));
  infoWindow.open(map, marker);
  popupOpen = true;
  openPopupLatLng = marker.getPosition();
}

function closePopup() {
  infoWindow.close();
  popupOpen = false;
  openPopupLatLng = null;
  renderVisible(); // 팝업 여는 동안 놓친 화면 변화가 있으면 이제 반영
}

function markerBorderKind(props) {
  if (props.isTesla) return "tesla";
  if (!isOpenNow(props.hours)) return "closed";
  if (props.parkingFree !== "Y") return "paid";
  return "normal";
}

function makeMarker(feature) {
  const [lng, lat] = feature.geometry.coordinates;
  const props = feature.properties;
  const color = stationColor(props.chargers);
  const marker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(lat, lng),
    image: getMarkerImage(color, markerBorderKind(props)),
  });
  kakao.maps.event.addListener(marker, "click", () => openPopupFor(marker, props));
  return marker;
}

// 현재 화면에 보여줄 개수가 이 값 이하면, 클러스터링(숫자 뭉치) 없이
// 전부 개별 마커로 그대로 찍는다 — 필터를 걸어서 대상이 적어졌을 때
// (예: NACS+DC콤보+NACS+수퍼차저만 켜면 전국이 200~300개 수준) 전국을
// 봐도 다 흩어져서 보이게 하기 위함이다. 개수가 많으면(예: 필터 없이
// AC완속까지 전부) 여전히 클러스터링해야 겹쳐서 안 보이는 걸 막는다.
const UNCLUSTER_THRESHOLD = 500;

let plainMarkers = []; // 클러스터러를 안 거치고 지도에 직접 얹은 마커들

function clearAllMarkers() {
  clusterer.clear();
  plainMarkers.forEach((m) => m.setMap(null));
  plainMarkers = [];
}

// 현재 지도 화면(뷰포트) 안에 들어오는 충전소만 걸러 다시 그린다.
// 너무 많으면(MAX_MARKERS 초과) 성능 보호를 위해 앞부분만 그리고 안내 문구를 보여준다.
function renderVisible() {
  const bounds = map.getBounds();
  const withinBounds = allFeatures.filter((f) => {
    const [lng, lat] = f.geometry.coordinates;
    if (!bounds.contain(new kakao.maps.LatLng(lat, lng))) return false;
    return (
      stationMatchesTypeFilter(f) &&
      stationMatchesParkingFilter(f) &&
      stationMatchesHoursFilter(f)
    );
  });

  const capped = withinBounds.length > MAX_MARKERS;
  const toRender = capped ? withinBounds.slice(0, MAX_MARKERS) : withinBounds;
  const markers = toRender.map(makeMarker);

  clearAllMarkers();
  if (withinBounds.length <= UNCLUSTER_THRESHOLD) {
    markers.forEach((m) => m.setMap(map));
    plainMarkers = markers;
  } else {
    clusterer.addMarkers(markers);
  }

  statusBar.textContent = capped
    ? `현재 화면에 ${withinBounds.length.toLocaleString()}개소 중 ${MAX_MARKERS.toLocaleString()}개만 표시 중 — 더 확대해 보세요`
    : `현재 화면 내 충전소 ${withinBounds.length.toLocaleString()}개소 표시 중`;
}

let userLatLng = null;
let userOverlay = null;
let radiusCircle = null;

// center(반경 km)가 화면에 다 들어오도록 하는 LatLngBounds를 만든다.
// Leaflet 때처럼 줌 레벨을 수동 계산하는 대신, 카카오의 setBounds에
// 맞춰 넣을 사각 범위만 계산해서 넘기면 카카오가 알아서 적절한 레벨을 고른다.
function boundsForRadius(center, radiusKm) {
  const latDelta = radiusKm / 111; // 위도 1도 ≈ 111km
  const lngDelta = radiusKm / (111 * Math.cos((center.getLat() * Math.PI) / 180));
  const sw = new kakao.maps.LatLng(center.getLat() - latDelta, center.getLng() - lngDelta);
  const ne = new kakao.maps.LatLng(center.getLat() + latDelta, center.getLng() + lngDelta);
  return new kakao.maps.LatLngBounds(sw, ne);
}

// map.setBounds()는 요청한 범위가 절대 안 잘리게 하려고, 딱 맞는 중간 확대
// 단계가 없으면 한 단계 더 넓게(축소된 쪽으로) 반올림한다. 카카오 레벨은
// 연속값이 아니라 정수 단계라서, 이 반올림 때문에 실제 화면에 보이는
// 범위가 요청한 반경보다 눈에 띄게(체감상 2배 정도) 넓어 보일 수 있다.
// setBounds 직후 레벨을 한 단계 낮춰(더 확대해서) 이걸 보정한다.
function setBoundsForRadius(center, radiusKm) {
  map.setBounds(boundsForRadius(center, radiusKm));
  map.setLevel(map.getLevel() - 1);
}

// 현재 위치 마커 + 반경 안내 원을 표시(있으면 위치만 갱신)
function showUserLocation(center) {
  userLatLng = center;

  if (userOverlay) {
    userOverlay.setPosition(center);
  } else {
    const el = document.createElement("div");
    el.className = "user-dot";
    el.title = "현재 위치";
    userOverlay = new kakao.maps.CustomOverlay({
      position: center,
      content: el,
      yAnchor: 0.5,
      xAnchor: 0.5,
      zIndex: 5,
    });
    userOverlay.setMap(map);
  }

  if (radiusCircle) {
    radiusCircle.setPosition(center);
  } else {
    radiusCircle = new kakao.maps.Circle({
      center,
      radius: RADIUS_KM * 1000,
      strokeWeight: 1,
      strokeColor: "#2563eb",
      strokeOpacity: 0.6,
      strokeStyle: "shortdash",
      fillColor: "#2563eb",
      fillOpacity: 0.04,
    });
    radiusCircle.setMap(map);
  }
}

// ---- 검색 ----
// 한 검색창에 입력하면 두 가지를 동시에 시도한다: 1) 카카오 지오코딩으로
// 주소인지 확인(맞으면 "이 위치로 이동" 옵션), 2) 이미 불러온 충전소
// 데이터에서 이름/주소/위치명에 일치하는 게 있는지(있으면 목록으로).
// 서버에 다시 물어볼 필요 없이 브라우저에 이미 있는 데이터로 검색한다.
function searchStationsByKeyword(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return allFeatures
    .filter((f) => {
      const p = f.properties;
      const haystack = `${p.statNm} ${p.addr} ${p.location}`.toLowerCase();
      return haystack.includes(q);
    })
    .slice(0, 20); // 너무 많으면 드롭다운이 감당 안 되니 상위 20개만
}

// "괴산"처럼 시/군 이름만 입력했을 때: keywordSearch는 전체 텍스트 검색이라
// 이름에 그 글자가 들어간 개별 장소(산, 휴게소 등)를 찾아버리지, "괴산군
// 전체"를 대표하는 결과를 안 준다. addressSearch가 행정구역 이름 자체는
// 더 잘 인식하는 경향이 있어 먼저 시도하고, 실패하면(완전한 주소가 아니면
// 결과가 없는 경우가 많음) keywordSearch로 재시도한다.
//
// 어느 API로 찾았는지(source)도 같이 반환한다 — 나중에 "이 결과가 행정구역
// 자체인지 특정 장소인지"를, 검색어 글자 수 같은 부정확한 방법 대신 결과
// 자체의 구조로 판단하는 데 쓴다.
function searchPlacePromise(query) {
  return new Promise((resolve) => {
    if (!kakao.maps.services) {
      resolve(null);
      return;
    }
    const geocoder = new kakao.maps.services.Geocoder();
    geocoder.addressSearch(query, (result, status) => {
      if (status === kakao.maps.services.Status.OK && result.length > 0) {
        resolve({ result: result[0], source: "address" });
        return;
      }
      const places = new kakao.maps.services.Places();
      places.keywordSearch(query, (result2, status2) => {
        if (status2 === kakao.maps.services.Status.OK && result2.length > 0) {
          resolve({ result: result2[0], source: "keyword" });
        } else {
          resolve(null);
        }
      });
    });
  });
}

// addressSearch 결과가 시/군/구 단위에서 멈췄는지(동/리/번지 같은 상세 정보가
// 없는지)로 "행정구역 자체"를 검색한 건지 판단한다 — "경복궁" 같은 특정
// 장소는 keywordSearch로 찾히므로(source="keyword") 여기 해당하지 않고,
// 언제나 그 지점만 좁게 보여준다. "괴산"/"성남시"처럼 addressSearch로 찾히고
// 동/리 상세가 없는 경우에만 그 지역 전체가 보이도록 넓게 확대한다.
function isRegionLevelResult(entry) {
  if (!entry || entry.source !== "address") return false;
  const addr = entry.result.address;
  if (!addr) return false;
  const hasDetail =
    (addr.region_3depth_name && addr.region_3depth_name.trim()) ||
    (addr.main_address_no && addr.main_address_no.trim());
  return !hasDetail;
}

// 검색 결과로 선택한 충전소로 지도를 이동시키고 팝업을 연다. 화면 밖/필터에
// 걸려 지금 안 보이던 곳이어도, 이동 후 renderVisible()이 다시 그려주므로
// 이동 직후에 곧바로 마커가 생긴다. InfoWindow는 marker 없이 좌표만으로도
// 열 수 있어(이미 하이패스 앱에서 쓴 패턴), 그 마커 객체를 따로 찾을 필요가 없다.
function goToStation(feature) {
  const [lng, lat] = feature.geometry.coordinates;
  const latlng = new kakao.maps.LatLng(lat, lng);
  setBoundsForRadius(latlng, RADIUS_KM);
  renderVisible();
  infoWindow.setContent(buildPopup(feature.properties));
  infoWindow.setPosition(latlng);
  infoWindow.open(map);
  popupOpen = true;
  openPopupLatLng = latlng;
  clearSearch();
}

function hideSearchResults() {
  document.getElementById("searchResults").classList.add("hidden");
}

// 결과를 실제로 선택해서 이동했을 때만 검색창 글자까지 비운다. 결과 바깥을
// 클릭해서 그냥 닫을 때(hideSearchResults만 호출되는 경우)는 입력했던 검색어를
// 그대로 남겨둔다 — 아직 고르는 중일 수도 있으니 지워버리면 불편하다.
function clearSearch() {
  document.getElementById("searchInput").value = "";
  hideSearchResults();
}

function renderSearchResults(placeEntry, stationMatches) {
  const box = document.getElementById("searchResults");
  let html = "";

  if (placeEntry) {
    const p = placeEntry.result;
    const label = p.place_name || p.address_name;
    const regionLevel = isRegionLevelResult(placeEntry);
    const moveLabel = regionLevel ? "이 지역 전체 보기" : "이 위치로 이동";
    html += `<div class="search-result-section-title">위치</div>`;
    html +=
      `<div class="search-result-item" data-kind="place" data-region-level="${regionLevel}" ` +
      `data-lat="${p.y}" data-lng="${p.x}">` +
      `<div class="name">📍 ${escapeHtml(label)}</div>` +
      `<div class="addr">${escapeHtml(p.address_name || "")} — ${moveLabel}</div></div>`;
  }

  if (stationMatches.length > 0) {
    html += `<div class="search-result-section-title">충전소 (${stationMatches.length}건)</div>`;
    stationMatches.forEach((f, idx) => {
      html +=
        `<div class="search-result-item" data-kind="station" data-idx="${idx}">` +
        `<div class="name">${escapeHtml(f.properties.statNm)}</div>` +
        `<div class="addr">${escapeHtml(f.properties.addr)}</div></div>`;
    });
  }

  if (!placeEntry && stationMatches.length === 0) {
    html = `<div class="search-result-empty">검색 결과가 없습니다.</div>`;
  }

  box.innerHTML = html;
  box.classList.remove("hidden");

  box.querySelectorAll(".search-result-item").forEach((el) => {
    el.addEventListener("click", () => {
      if (el.dataset.kind === "place") {
        const latlng = new kakao.maps.LatLng(parseFloat(el.dataset.lat), parseFloat(el.dataset.lng));
        if (el.dataset.regionLevel === "true") {
          map.setCenter(latlng);
          map.setLevel(REGION_VIEW_LEVEL);
        } else {
          setBoundsForRadius(latlng, RADIUS_KM);
        }
        renderVisible();
        clearSearch();
      } else {
        goToStation(stationMatches[parseInt(el.dataset.idx, 10)]);
      }
    });
  });
}

async function performSearch() {
  const query = document.getElementById("searchInput").value.trim();
  if (!query) {
    hideSearchResults();
    return;
  }
  const stationMatches = searchStationsByKeyword(query);
  const placeEntry = await searchPlacePromise(query);
  renderSearchResults(placeEntry, stationMatches);
}

document.getElementById("searchBtn").addEventListener("click", performSearch);
document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") performSearch();
});
document.addEventListener("click", (e) => {
  const box = document.getElementById("searchBox");
  if (box && !box.contains(e.target)) hideSearchResults();
});

// "현재 위치로 이동" 버튼 핸들러: 이미 위치를 알고 있으면 바로 이동,
// 모르면(아직 못 받았거나 최초 거부 후 다시 시도) 새로 요청한다.
function goToUserLocation() {
  if (userLatLng) {
    setBoundsForRadius(userLatLng, RADIUS_KM);
    renderVisible();
  } else {
    requestLocation();
  }
}

function requestLocation() {
  if (!navigator.geolocation) {
    statusBar.textContent = "이 브라우저는 위치 정보를 지원하지 않습니다.";
    renderVisible();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const center = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
      showUserLocation(center);
      setBoundsForRadius(center, RADIUS_KM);
      renderVisible();
    },
    (err) => {
      console.warn("위치 정보를 가져오지 못했습니다:", err.message);
      statusBar.textContent = "위치 권한이 없어 현재 화면 기준으로 표시합니다.";
      renderVisible();
    },
    { timeout: 8000, maximumAge: 5 * 60 * 1000 }
  );
}

document.querySelectorAll(".filter-chip[data-type]").forEach((chip) => {
  chip.addEventListener("click", () => {
    const type = chip.dataset.type;
    if (activeTypeFilters.has(type)) {
      activeTypeFilters.delete(type);
      chip.classList.remove("active");
    } else {
      activeTypeFilters.add(type);
      chip.classList.add("active");
    }
    if (dataLoaded) renderVisible();
  });
});

document.getElementById("paid-parking-toggle").addEventListener("click", (e) => {
  showPaidParking = !showPaidParking;
  e.currentTarget.classList.toggle("active", showPaidParking);
  if (dataLoaded) renderVisible();
});

document.getElementById("show-closed-toggle").addEventListener("click", (e) => {
  showClosedStations = !showClosedStations;
  e.currentTarget.classList.toggle("active", showClosedStations);
  if (dataLoaded) renderVisible();
});

function formatKstTime(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleString("ko-KR", {
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
  });
}

let lastMeta = null;

function renderLastUpdated(meta) {
  lastMeta = meta;
  const detailEl = document.getElementById("regionUpdateDetail");
  if (!meta) {
    lastUpdatedEl.textContent = "";
    lastUpdatedEl.classList.remove("has-detail");
    detailEl.classList.add("hidden");
    return;
  }
  const skipLabel = (status) => {
    if (status === "skipped_quota_exceeded") return " (한도초과로 건너뜀)";
    if (status === "skipped_suspicious_empty_result") return " (이상 응답으로 건너뜀)";
    return "";
  };
  const parts = [];
  const full = meta.lastFullUpdate;
  const status = meta.lastStatusUpdate;
  if (full) {
    parts.push(`지역갱신 ${formatKstTime(full.time)}${skipLabel(full.status)}`);
  }
  if (status) {
    parts.push(`상태갱신 ${formatKstTime(status.time)}${skipLabel(status.status)}`);
  }

  const hasRegionDetail = meta.regionUpdates && Object.keys(meta.regionUpdates).length > 0;
  lastUpdatedEl.textContent = parts.join(" · ") + (hasRegionDetail ? " (지역별 보기 ▾)" : "");
  lastUpdatedEl.classList.toggle("has-detail", !!hasRegionDetail);
  // meta가 새로 로드될 때마다(새로고침 등) 상세 패널은 일단 접어둔다.
  detailEl.classList.add("hidden");
}

// "지역갱신 ..." 표시를 누르면, 지역(zcode)별로 실제 마지막 갱신 시각을
// 펼쳐서 보여준다 — 가장 오래된(=다음에 갱신이 필요할 가능성이 높은)
// 지역이 위로 오도록 정렬한다.
function toggleRegionDetail() {
  if (!lastMeta || !lastMeta.regionUpdates) return;
  const detailEl = document.getElementById("regionUpdateDetail");
  if (!detailEl.classList.contains("hidden")) {
    detailEl.classList.add("hidden");
    return;
  }
  const entries = Object.values(lastMeta.regionUpdates).sort(
    (a, b) => new Date(a.time) - new Date(b.time)
  );
  detailEl.innerHTML = entries
    .map(
      (e) =>
        `<div class="region-row"><span>${escapeHtml(e.name)}</span>` +
        `<span>${formatKstTime(e.time)} · ${e.count.toLocaleString()}개소</span></div>`
    )
    .join("");
  detailEl.classList.remove("hidden");
}

lastUpdatedEl.addEventListener("click", toggleRegionDetail);

async function loadData() {
  statusBar.textContent = "불러오는 중...";
  try {
    const res = await fetch("data/chargers.geojson", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geojson = await res.json();

    allFeatures = geojson.features;
    dataLoaded = true;
    renderLastUpdated(geojson.meta);

    requestLocation();
  } catch (err) {
    console.error(err);
    statusBar.textContent = "데이터를 불러오지 못했습니다. data/chargers.geojson 파일을 확인해 주세요.";
  }
}

function initMap() {
  const mapContainer = document.getElementById("map");
  map = new kakao.maps.Map(mapContainer, {
    center: new kakao.maps.LatLng(DEFAULT_CENTER[0], DEFAULT_CENTER[1]),
    level: DEFAULT_LEVEL,
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

  clusterer = new kakao.maps.MarkerClusterer({
    map,
    averageCenter: true,
    minLevel: CLUSTER_MIN_LEVEL,
    gridSize: 60,
  });

  infoWindow = new kakao.maps.InfoWindow({ removable: false, zIndex: 20 });

  // 지도 빈 곳을 클릭하면 팝업을 닫는다(마커 클릭은 이 이벤트로 안 번짐).
  kakao.maps.event.addListener(map, "click", () => {
    if (popupOpen) closePopup();
  });

  // 사용자가 지도를 이동/확대·축소한 뒤, 완전히 멈추고 나서
  // MOVE_SETTLE_DELAY_MS만큼 더 기다렸다가 현재 화면 기준으로 다시 표출한다.
  // 팝업이 열려있는 동안은 원래 화면을 안 건드렸는데, 그러면 팝업이 붙은
  // 충전소가 화면 밖으로 나가도 지도가 계속 안 갱신되는 문제가 있었다.
  // 이제는 팝업이 열려있어도, 그 좌표가 화면(뷰포트) 밖으로 나가면 팝업을
  // 자동으로 닫고 새 화면 기준으로 다시 그린다. 화면 안에 그대로 있으면
  // (팝업 보면서 살짝만 움직인 경우 등) 지금처럼 유지한다.
  kakao.maps.event.addListener(map, "idle", () => {
    if (!dataLoaded) return;
    if (popupOpen) {
      if (openPopupLatLng && !map.getBounds().contain(openPopupLatLng)) {
        closePopup();
      }
      return;
    }
    if (moveEndTimer) clearTimeout(moveEndTimer);
    moveEndTimer = setTimeout(renderVisible, MOVE_SETTLE_DELAY_MS);
  });

  const locateBtn = document.createElement("button");
  locateBtn.type = "button";
  locateBtn.className = "locate-btn";
  locateBtn.title = "현재 위치로 이동";
  locateBtn.innerHTML = "⦿";
  locateBtn.addEventListener("click", goToUserLocation);
  mapContainer.appendChild(locateBtn);

  loadData();
}

kakao.maps.load(initMap);
</script>
</body>
