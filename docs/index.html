<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전국 테슬라 충전 지도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="완속충전기" />

<style>
  :root {
    --ink: #1c2320;
    --paper: #f6f5f1;
    --line: #d8d6cd;
    --available: #2f7d5a;
    --charging: #c98a2c;
    --other: #9a968a;
    --accent: #1c2320;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    z-index: 1000;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header .sub {
    font-size: 12px;
    color: #6b6a63;
    margin-top: 2px;
  }

  .filter-chip {
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 4px;
  }

  .filter-chip:hover {
    background: #e8e6df;
  }

  .filter-chip.active {
    background: var(--ink);
    color: #fff;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
  }

  .legend .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap
  }

  .legend .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }

  #status-bar {
    font-size: 12px;
    color: #6b6a63;
    padding: 4px 20px;
    border-bottom: 1px solid var(--line);
  }

  #last-updated {
    font-size: 11px;
    color: #9a968a;
    padding: 0 20px 4px;
    border-bottom: 1px solid var(--line);
  }

  #map {
    flex: 1;
    position: relative; /* locate-btn을 이 안에서 절대 위치로 띄우기 위함 */
  }

  .popup {
    font-size: 13px;
    line-height: 1.5;
    min-width: 240px;
    max-width: 300px;
    max-height: 55vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    padding: 12px 16px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .popup .popup-close {
    position: absolute;
    top: 6px;
    right: 8px;
    border: none;
    background: none;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    color: #888;
    padding: 4px;
  }

  .popup h3 {
    margin: 0 0 4px;
    font-size: 14px;
    padding-right: 20px;
  }

  .popup .addr {
    color: #555;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .popup .location {
    color: #777;
    font-size: 12px;
    margin-top: -4px;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .popup .field {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 0;
    border-bottom: 1px dashed #e4e2d9;
  }

  .popup .field:last-of-type { border-bottom: none; }

  .popup .field .k { color: #777; flex-shrink: 0; }
  .popup .field .v { text-align: right; }

  .popup .chargers {
    margin-top: 8px;
    border-top: 1px solid var(--line);
    padding-top: 6px;
  }

  .popup .charger-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
  }

  .popup .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    color: #fff;
    flex-shrink: 0;
  }

  .popup .note {
    margin-top: 8px;
    padding: 6px 8px;
    background: #fbf3e1;
    border-radius: 6px;
    color: #7a5b12;
    font-size: 11.5px;
  }

  .tesla-badge {
    display: inline-block;
    margin-bottom: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #cc0000;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
  }

  .locate-btn {
    position: absolute;
    right: 12px;
    bottom: 24px;
    z-index: 10;
    width: 40px;
    height: 40px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .locate-btn:hover { background: #f3f6ff; }
  .locate-btn:active { transform: translateY(1px); }

  .user-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35), 0 0 0 1px #fff;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>전국 테슬라 충전 지도</h1>
      <div class="sub" id="type-filter">
        <span class="filter-chip" data-type="02">AC완속</span> /
        <span class="filter-chip" data-type="09">NACS</span> /
        <span class="filter-chip" data-type="10">DC콤보+NACS</span> /
        <span class="filter-chip" data-type="TESLA">수퍼차저</span>
      </div>
    </div>
    <div class="legend">
      <span class="chip"><span class="dot" style="background:var(--available)"></span>충전가능</span>
      <span class="chip"><span class="dot" style="background:var(--charging)"></span>충전중</span>
      <span class="chip"><span class="dot" style="background:var(--other)"></span>충전불가</span>
      <span class="chip"><span class="dot" style="background:#fff;box-shadow:0 0 0 2px #cc0000"></span>수퍼차저</span>
    </div>
  </header>
  <div id="status-bar">불러오는 중...</div>
  <div id="last-updated"></div>
  <div id="map"></div>
</div>

<!--
  카카오맵 JS 키 설정 필요:
  1. https://developers.kakao.com 에서 기존 앱 선택
  2. 앱 설정 → 플랫폼 → Web 플랫폼 등록 → 사이트 도메인에 https://murianwind.github.io 추가
  3. 제품 설정 → 지도(Maps) 활성화
  4. 앱 설정 → 앱 키 → "JavaScript 키" 복사해서 아래 appkey= 뒤에 붙여넣기
     (REST API 키랑 다른 키입니다 — 지오코딩용 키를 여기 쓰면 안 됩니다)
-->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=41a435402a9a232bd1d9804a4a795937&libraries=clusterer&autoload=false"></script>
<script>
const STATUS_COLOR = {
  "2": "#2f7d5a", // 충전가능
  "3": "#c98a2c", // 충전중
  DEFAULT: "#9a968a", // 통신이상 / 운영중지 / 점검중 / 알수없음
};

const RADIUS_KM = 5;
const MOVE_SETTLE_DELAY_MS = 800; // 지도 이동이 끝난 뒤 이 시간만큼 더 기다렸다가 재표출
const DEFAULT_CENTER = [36.4, 127.9];
// 카카오 지도는 레벨 숫자가 작을수록 확대(=Leaflet 줌과 반대 방향)이다.
// 13 정도가 전국이 대략 다 보이는 수준.
const DEFAULT_LEVEL = 13;
// 이 레벨보다 축소된(숫자가 큰) 상태에서만 클러스터링한다 — 이 값보다
// 확대하면(숫자가 작아지면) 클러스터링을 끄고 마커를 각자 그대로 찍는다.
const CLUSTER_MIN_LEVEL = 6;

const statusBar = document.getElementById("status-bar");
const lastUpdatedEl = document.getElementById("last-updated");

let map;
let clusterer;
let infoWindow; // 팝업 하나를 계속 재사용한다(마커마다 새로 안 만듦)
let popupOpen = false;

let allFeatures = [];
let dataLoaded = false;
let moveEndTimer = null;
const MAX_MARKERS = 1500; // 한 번에 그리는 마커 최대 개수 (성능 보호용 캡)
const POPUP_MAX_WIDTH = Math.max(220, Math.min(280, window.innerWidth - 40));

// 헤더의 AC완속/NACS/DC콤보+NACS/수퍼차저 칩 필터. 여러 개 선택하면
// 그중 하나라도 해당하는 충전소를 전부 표시한다(합집합). 아무것도
// 선택 안 하면(기본값) 전체를 표시한다.
const activeTypeFilters = new Set();

function stationMatchesTypeFilter(feature) {
  if (activeTypeFilters.size === 0) return true;
  const props = feature.properties;
  if (activeTypeFilters.has("TESLA") && props.isTesla) return true;
  return (props.chargers || []).some((c) => activeTypeFilters.has(c.chgerType));
}

function stationColor(chargers) {
  const stats = chargers.map((c) => c.stat);
  if (stats.includes("2")) return STATUS_COLOR["2"];
  if (stats.includes("3")) return STATUS_COLOR["3"];
  return STATUS_COLOR.DEFAULT;
}

function escapeHtml(str) {
  if (str === undefined || str === null || str === "") return "-";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function floorLabel(props) {
  const type = props.floorType === "B" ? "지하" : props.floorType === "F" ? "지상" : "";
  if (!type) return "-";
  const num = props.floorNum ? `${props.floorNum}층` : "";
  return `${type} ${num}`.trim();
}

function buildPopup(props) {
  // addr는 저희가 정리한 깨끗한 주소만 담고 있지만, addrDetail은 API 원본
  // 그대로라 "지하1층" 같은 짧은 정보뿐 아니라 "청주시 평생학습관"처럼
  // 시설명 전체가 들어있는 경우도 많다. 그래서 addrDetail을 주소 줄에
  // 붙이지 않고, location(우리가 추출한 시설명)과 같은 줄로 보낸다.
  const addrLine = escapeHtml(props.addr);

  // addrDetail과 location이 API 원본 그대로 완전히 같은 문자열인 경우가
  // 많다(둘 다 그냥 "주차장"인 식). 그대로 이어붙이면 "주차장 주차장"처럼
  // 중복되니, 정확히 같은 문자열이면 한 번만 남긴다.
  const locationParts = [props.addrDetail, props.location]
    .map((part) => (part || "").trim())
    .filter(Boolean);
  const uniqueLocationParts = [...new Set(locationParts)];
  const locationText = uniqueLocationParts.join(" ");
  const locationLine = locationText ? `<div class="location">${escapeHtml(locationText)}</div>` : "";

  const teslaBadge = props.isTesla
    ? `<div class="tesla-badge">⚡ 테슬라 슈퍼차저</div>`
    : "";

  const closeBtn = `<button type="button" class="popup-close" onclick="closePopup()">✕</button>`;

  if (props.isTesla) {
    // supercharge.info는 실시간 사용 가능 여부를 제공하지 않아서,
    // 개별 커넥터 상태를 지어내지 않고 요약 정보만 보여준다.
    return `
      <div class="popup" style="position:relative;">
        ${closeBtn}
        ${teslaBadge}
        <h3>${escapeHtml(props.statNm)}</h3>
        <div class="addr">${addrLine}</div>
        ${locationLine}
        <div class="field"><span class="k">이용시간</span><span class="v">${escapeHtml(props.useTime)}</span></div>
        <div class="note">충전기 상태 정보 미제공</div>
        <div class="field"><span class="k">${escapeHtml(props.teslaSummary)}</span></div>
      </div>`;
  }

  const chargerRows = props.chargers
    .map((c) => {
      const color = STATUS_COLOR[c.stat] || STATUS_COLOR.DEFAULT;
      return `
        <div class="charger-row">
          <span>${escapeHtml(c.chgerTypeName)}${c.output ? ` (${escapeHtml(c.output)}kW)` : ""}</span>
          <span class="badge" style="background:${color}">${escapeHtml(c.statName)}</span>
        </div>`;
    })
    .join("");

  // limitYn=N으로 필터링된 항목이라도 limitDetail에 값이 남아있는 경우,
  // 추후 필터 조건 보강을 위해 그대로 노출한다.
  const limitNote = props.limitDetail
    ? `<div class="note">이용제한 사유(참고): ${escapeHtml(props.limitDetail)}</div>`
    : "";

  const limitLabel =
    props.limitYn === "N" ? "없음" : props.limitYn === "Y" ? "있음" : "확인 필요";
  const parkingLabel =
    props.parkingFree === "Y" ? "무료" : props.parkingFree === "N" ? "유료" : "확인 필요";

  return `
    <div class="popup" style="position:relative;">
      ${closeBtn}
      <h3>${escapeHtml(props.statNm)}</h3>
      <div class="addr">${addrLine}</div>
      ${locationLine}
      <div class="field"><span class="k">이용시간</span><span class="v">${escapeHtml(props.useTime)}</span></div>
      <div class="field"><span class="k">운영기관</span><span class="v">${escapeHtml(props.busiNm)}</span></div>
      <div class="field"><span class="k">이용자 제한</span><span class="v">${limitLabel}</span></div>
      <div class="field"><span class="k">주차료</span><span class="v">${parkingLabel}</span></div>
      <div class="field"><span class="k">지상/지하</span><span class="v">${floorLabel(props)}</span></div>
      <div class="chargers">${chargerRows}</div>
      ${limitNote}
    </div>`;
}

// 색깔 원 마커 이미지를 SVG로 만든다. 실제로 쓰이는 조합이 몇 개 안 되니
// (초록/주황/회색 × 흰테두리, 회색×빨간테두리(테슬라)) 캐시해서 재사용한다.
const markerImageCache = new Map();

function getMarkerImage(fillColor, isTesla) {
  const borderColor = isTesla ? "#cc0000" : "#ffffff";
  const borderWidth = isTesla ? 3 : 2;
  const size = 18;
  const key = `${fillColor}|${borderColor}|${borderWidth}`;
  if (markerImageCache.has(key)) return markerImageCache.get(key);

  const r = size / 2 - borderWidth / 2;
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">` +
    `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="${fillColor}" ` +
    `stroke="${borderColor}" stroke-width="${borderWidth}" ` +
    `style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));" /></svg>`;
  const dataUri = "data:image/svg+xml;base64," + btoa(svg);
  const image = new kakao.maps.MarkerImage(
    dataUri,
    new kakao.maps.Size(size, size),
    { offset: new kakao.maps.Point(size / 2, size / 2) }
  );
  markerImageCache.set(key, image);
  return image;
}

function openPopupFor(marker, props) {
  infoWindow.setContent(buildPopup(props));
  infoWindow.open(map, marker);
  popupOpen = true;
}

function closePopup() {
  infoWindow.close();
  popupOpen = false;
  renderVisible(); // 팝업 여는 동안 놓친 화면 변화가 있으면 이제 반영
}

function makeMarker(feature) {
  const [lng, lat] = feature.geometry.coordinates;
  const props = feature.properties;
  const color = stationColor(props.chargers);
  const marker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(lat, lng),
    image: getMarkerImage(color, !!props.isTesla),
  });
  kakao.maps.event.addListener(marker, "click", () => openPopupFor(marker, props));
  return marker;
}

// 현재 화면에 보여줄 개수가 이 값 이하면, 클러스터링(숫자 뭉치) 없이
// 전부 개별 마커로 그대로 찍는다 — 필터를 걸어서 대상이 적어졌을 때
// (예: NACS+DC콤보+NACS+수퍼차저만 켜면 전국이 200~300개 수준) 전국을
// 봐도 다 흩어져서 보이게 하기 위함이다. 개수가 많으면(예: 필터 없이
// AC완속까지 전부) 여전히 클러스터링해야 겹쳐서 안 보이는 걸 막는다.
const UNCLUSTER_THRESHOLD = 500;

let plainMarkers = []; // 클러스터러를 안 거치고 지도에 직접 얹은 마커들

function clearAllMarkers() {
  clusterer.clear();
  plainMarkers.forEach((m) => m.setMap(null));
  plainMarkers = [];
}

// 현재 지도 화면(뷰포트) 안에 들어오는 충전소만 걸러 다시 그린다.
// 너무 많으면(MAX_MARKERS 초과) 성능 보호를 위해 앞부분만 그리고 안내 문구를 보여준다.
function renderVisible() {
  const bounds = map.getBounds();
  const withinBounds = allFeatures.filter((f) => {
    const [lng, lat] = f.geometry.coordinates;
    return bounds.contain(new kakao.maps.LatLng(lat, lng)) && stationMatchesTypeFilter(f);
  });

  const capped = withinBounds.length > MAX_MARKERS;
  const toRender = capped ? withinBounds.slice(0, MAX_MARKERS) : withinBounds;
  const markers = toRender.map(makeMarker);

  clearAllMarkers();
  if (withinBounds.length <= UNCLUSTER_THRESHOLD) {
    markers.forEach((m) => m.setMap(map));
    plainMarkers = markers;
  } else {
    clusterer.addMarkers(markers);
  }

  statusBar.textContent = capped
    ? `현재 화면에 ${withinBounds.length.toLocaleString()}개소 중 ${MAX_MARKERS.toLocaleString()}개만 표시 중 — 더 확대해 보세요`
    : `현재 화면 내 충전소 ${withinBounds.length.toLocaleString()}개소 표시 중`;
}

let userLatLng = null;
let userOverlay = null;
let radiusCircle = null;

// center(반경 km)가 화면에 다 들어오도록 하는 LatLngBounds를 만든다.
// Leaflet 때처럼 줌 레벨을 수동 계산하는 대신, 카카오의 setBounds에
// 맞춰 넣을 사각 범위만 계산해서 넘기면 카카오가 알아서 적절한 레벨을 고른다.
function boundsForRadius(center, radiusKm) {
  const latDelta = radiusKm / 111; // 위도 1도 ≈ 111km
  const lngDelta = radiusKm / (111 * Math.cos((center.getLat() * Math.PI) / 180));
  const sw = new kakao.maps.LatLng(center.getLat() - latDelta, center.getLng() - lngDelta);
  const ne = new kakao.maps.LatLng(center.getLat() + latDelta, center.getLng() + lngDelta);
  return new kakao.maps.LatLngBounds(sw, ne);
}

// 현재 위치 마커 + 반경 안내 원을 표시(있으면 위치만 갱신)
function showUserLocation(center) {
  userLatLng = center;

  if (userOverlay) {
    userOverlay.setPosition(center);
  } else {
    const el = document.createElement("div");
    el.className = "user-dot";
    el.title = "현재 위치";
    userOverlay = new kakao.maps.CustomOverlay({
      position: center,
      content: el,
      yAnchor: 0.5,
      xAnchor: 0.5,
      zIndex: 5,
    });
    userOverlay.setMap(map);
  }

  if (radiusCircle) {
    radiusCircle.setPosition(center);
  } else {
    radiusCircle = new kakao.maps.Circle({
      center,
      radius: RADIUS_KM * 1000,
      strokeWeight: 1,
      strokeColor: "#2563eb",
      strokeOpacity: 0.6,
      strokeStyle: "shortdash",
      fillColor: "#2563eb",
      fillOpacity: 0.04,
    });
    radiusCircle.setMap(map);
  }
}

// "현재 위치로 이동" 버튼 핸들러: 이미 위치를 알고 있으면 바로 이동,
// 모르면(아직 못 받았거나 최초 거부 후 다시 시도) 새로 요청한다.
function goToUserLocation() {
  if (userLatLng) {
    map.setBounds(boundsForRadius(userLatLng, RADIUS_KM));
    renderVisible();
  } else {
    requestLocation();
  }
}

function requestLocation() {
  if (!navigator.geolocation) {
    statusBar.textContent = "이 브라우저는 위치 정보를 지원하지 않습니다.";
    renderVisible();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const center = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
      showUserLocation(center);
      map.setBounds(boundsForRadius(center, RADIUS_KM));
      renderVisible();
    },
    (err) => {
      console.warn("위치 정보를 가져오지 못했습니다:", err.message);
      statusBar.textContent = "위치 권한이 없어 현재 화면 기준으로 표시합니다.";
      renderVisible();
    },
    { timeout: 8000, maximumAge: 5 * 60 * 1000 }
  );
}

document.querySelectorAll(".filter-chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const type = chip.dataset.type;
    if (activeTypeFilters.has(type)) {
      activeTypeFilters.delete(type);
      chip.classList.remove("active");
    } else {
      activeTypeFilters.add(type);
      chip.classList.add("active");
    }
    if (dataLoaded) renderVisible();
  });
});

function formatKstTime(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleString("ko-KR", {
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function renderLastUpdated(meta) {
  if (!meta) {
    lastUpdatedEl.textContent = "";
    return;
  }
  const skipLabel = (status) => {
    if (status === "skipped_quota_exceeded") return " (한도초과로 건너뜀)";
    if (status === "skipped_suspicious_empty_result") return " (이상 응답으로 건너뜀)";
    return "";
  };
  const parts = [];
  const full = meta.lastFullUpdate;
  const status = meta.lastStatusUpdate;
  if (full) {
    parts.push(`지역갱신 ${formatKstTime(full.time)}${skipLabel(full.status)}`);
  }
  if (status) {
    parts.push(`상태갱신 ${formatKstTime(status.time)}${skipLabel(status.status)}`);
  }
  lastUpdatedEl.textContent = parts.join(" · ");
}

async function loadData() {
  statusBar.textContent = "불러오는 중...";
  try {
    const res = await fetch("data/chargers.geojson", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const geojson = await res.json();

    allFeatures = geojson.features;
    dataLoaded = true;
    renderLastUpdated(geojson.meta);

    requestLocation();
  } catch (err) {
    console.error(err);
    statusBar.textContent = "데이터를 불러오지 못했습니다. data/chargers.geojson 파일을 확인해 주세요.";
  }
}

function initMap() {
  const mapContainer = document.getElementById("map");
  map = new kakao.maps.Map(mapContainer, {
    center: new kakao.maps.LatLng(DEFAULT_CENTER[0], DEFAULT_CENTER[1]),
    level: DEFAULT_LEVEL,
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

  clusterer = new kakao.maps.MarkerClusterer({
    map,
    averageCenter: true,
    minLevel: CLUSTER_MIN_LEVEL,
    gridSize: 60,
  });

  infoWindow = new kakao.maps.InfoWindow({ removable: false, zIndex: 20 });

  // 지도 빈 곳을 클릭하면 팝업을 닫는다(마커 클릭은 이 이벤트로 안 번짐).
  kakao.maps.event.addListener(map, "click", () => {
    if (popupOpen) closePopup();
  });

  // 사용자가 지도를 이동/확대·축소한 뒤, 완전히 멈추고 나서
  // MOVE_SETTLE_DELAY_MS만큼 더 기다렸다가 현재 화면 기준으로 다시 표출한다.
  kakao.maps.event.addListener(map, "idle", () => {
    if (!dataLoaded || popupOpen) return;
    if (moveEndTimer) clearTimeout(moveEndTimer);
    moveEndTimer = setTimeout(renderVisible, MOVE_SETTLE_DELAY_MS);
  });

  const locateBtn = document.createElement("button");
  locateBtn.type = "button";
  locateBtn.className = "locate-btn";
  locateBtn.title = "현재 위치로 이동";
  locateBtn.innerHTML = "⦿";
  locateBtn.addEventListener("click", goToUserLocation);
  mapContainer.appendChild(locateBtn);

  loadData();
}

kakao.maps.load(initMap);
</script>
