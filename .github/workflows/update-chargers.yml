name: Update EV Charger Data (daily region)

on:
  workflow_dispatch:
    inputs:
      full_seed:
        description: "전체 지역을 한 번에 갱신 (전국 데이터 초기 채우기용, 평소엔 체크하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, home-pc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch charger info
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          FULL_SEED: ${{ inputs.full_seed && '1' || '' }}
        run: python scripts/fetch_chargers.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chargers.geojson
          git diff --cached --quiet && { echo "변경 없음, 커밋 생략"; exit 0; }
          git commit -m "chore: charger data refresh (manual)"

          # 보통은 바로 push되지만, 그 사이 다른 실행(예: 상태 델타)이 먼저
          # push했으면 거부(reject)당할 수 있다. 이 파일은 매번 스크립트가
          # 통째로 새로 만드는 데이터라 사람이 편집할 일이 없으므로, 거부되면
          # 방금 만든 우리 커밋 내용(파일)을 그대로 유지한 채 origin의 최신
          # 커밋 위로 올려서 다시 push한다 — rebase의 애매한 자동병합에
          # 기대지 않고, "우리가 방금 만든 파일 내용"을 명시적으로 다시
          # 커밋하므로 데이터가 조용히 유실될 걱정이 없다.
          if ! git push origin HEAD:main; then
            echo "push 거부됨 — 최신 상태 위로 다시 올려서 재시도"
            git fetch origin main
            git reset --soft origin/main
            git add docs/data/chargers.geojson
            git commit -m "chore: charger data refresh (manual)"
            git push origin HEAD:main
          fi
