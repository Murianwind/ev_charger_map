name: Update EV Charger Data (daily region)

on:
  workflow_dispatch:
    inputs:
      full_seed:
        description: "전체 지역을 한 번에 갱신 (전국 데이터 초기 채우기용, 평소엔 체크하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, home-pc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch charger info
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          FULL_SEED: ${{ inputs.full_seed && '1' || '' }}
        run: python scripts/fetch_chargers.py

      - name: Commit updated data
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          FULL_SEED: ${{ inputs.full_seed && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chargers.geojson
          git diff --cached --quiet && { echo "변경 없음, 커밋 생략"; exit 0; }
          git commit -m "chore: charger data refresh (manual)"

          if ! git push origin HEAD:main; then
            echo "push 거부됨 — 우리 파일을 그대로 다시 밀어넣으면 그 사이 다른"
            echo "실행(예: 상태 델타)이 반영한 내용을 덮어써버릴 수 있다."
            echo "그래서 최신 상태를 새로 받아와 스크립트를 처음부터 다시 돌린다"
            echo "(API를 한 번 더 호출하게 되지만, 데이터 유실보다는 낫다)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/fetch_chargers.py
            git add docs/data/chargers.geojson
            git diff --cached --quiet && { echo "변경 없음, 커밋 생략"; exit 0; }
            git commit -m "chore: charger data refresh (manual)"
            git push origin HEAD:main
          fi
