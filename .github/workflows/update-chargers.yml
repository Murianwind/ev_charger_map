name: Update EV Charger Data (daily region)

on:
  workflow_dispatch:
    inputs:
      full_seed:
        description: "전체 지역을 한 번에 갱신 (전국 데이터 초기 채우기용, 평소엔 체크하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, home-pc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch charger info
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          FULL_SEED: ${{ inputs.full_seed && '1' || '' }}
        run: python scripts/fetch_chargers.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chargers.geojson
          git diff --cached --quiet || git commit -m "chore: charger data refresh (manual)"
          git fetch origin main
          git rebase origin/main -X ours || git rebase --abort
          git push
