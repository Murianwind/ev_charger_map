name: Update EV Charger Data (daily region)

on:
  workflow_dispatch:
    inputs:
      full_seed:
        description: "전체 지역을 한 번에 갱신 (전국 데이터 초기 채우기용, 평소엔 체크하지 않음)"
        type: boolean
        default: false

# 러너가 한동안 오프라인이면 대기열에 여러 번 쌓일 수 있다. 같은
# concurrency 그룹으로 묶으면 "아직 시작 안 한(대기 중)" 이전 실행은
# 자동으로 취소되고 최신 것만 남는다. cancel-in-progress는 기본값(false)
# 그대로 둬서, 이미 실행 중인 FULL_SEED(오래 걸릴 수 있음)는 중간에
# 취소되지 않고 끝까지 돈다 — 대기 중인 중복만 정리된다.
concurrency:
  group: update-chargers

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, home-pc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch charger info
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          FULL_SEED: ${{ inputs.full_seed && '1' || '' }}
        run: python scripts/fetch_chargers.py

      - name: Commit updated data
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          FULL_SEED: ${{ inputs.full_seed && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chargers.geojson
          git diff --cached --quiet && { echo "변경 없음, 커밋 생략"; exit 0; }
          git commit -m "chore: charger data refresh (manual)"

          if ! git push origin HEAD:main; then
            echo "push 거부됨 — 우리 파일을 그대로 다시 밀어넣으면 그 사이 다른"
            echo "실행(예: 상태 델타)이 반영한 내용을 덮어써버릴 수 있다."
            echo "그래서 최신 상태를 새로 받아와 스크립트를 처음부터 다시 돌린다"
            echo "(API를 한 번 더 호출하게 되지만, 데이터 유실보다는 낫다)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/fetch_chargers.py
            git add docs/data/chargers.geojson
            git diff --cached --quiet && { echo "변경 없음, 커밋 생략"; exit 0; }
            git commit -m "chore: charger data refresh (manual)"
            git push origin HEAD:main
          fi
