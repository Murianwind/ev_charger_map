name: Update EV Charger Status (delta)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-status:
    runs-on: [self-hosted, home-pc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch status delta
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          EV_STATUS_PERIOD_MIN: "10"
        run: python scripts/fetch_status.py

      - name: Commit status changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chargers.geojson
          git diff --cached --quiet && { echo "변경 없음, 커밋 생략"; exit 0; }
          git commit -m "chore: charger status delta update"

          if ! git push origin HEAD:main; then
            echo "push 거부됨 — 최신 상태 위로 다시 올려서 재시도"
            git fetch origin main
            git reset --soft origin/main
            git add docs/data/chargers.geojson
            git commit -m "chore: charger status delta update"
            git push origin HEAD:main
          fi
