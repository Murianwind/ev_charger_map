name: Update EV Charger Status (delta)

on:
  schedule:
    # 10분 간격 (GitHub 스케줄은 부하가 몰릴 때 몇 분 밀릴 수 있음)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # full 워크플로와 같은 병렬-IP 시도 패턴. 델타 조회라 호출량이 적어서
  # 시도 횟수는 3개로 줄여 API 일일 한도를 아낀다.
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log runner IP
        id: getip
        continue-on-error: true
        run: |
          IP=$(curl -s --max-time 10 ifconfig.me || echo "unknown")
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "[attempt ${{ matrix.attempt }}] Runner outbound IP: $IP"

      - name: Run status delta script
        id: run_script
        continue-on-error: true
        timeout-minutes: 4
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          EV_STATUS_PERIOD_MIN: "10"
        run: python scripts/fetch_status.py

      - name: Write attempt report
        if: always()
        run: |
          mkdir -p report
          cat > "report/report-${{ matrix.attempt }}.json" << EOF
          {"attempt": ${{ matrix.attempt }}, "ip": "${{ steps.getip.outputs.ip }}", "outcome": "${{ steps.run_script.outcome }}"}
          EOF

      - name: Upload attempt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-attempt-${{ matrix.attempt }}
          path: report/report-${{ matrix.attempt }}.json
          retention-days: 3

      - name: Upload result (only if fetch succeeded)
        if: steps.run_script.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: chargers-attempt-${{ matrix.attempt }}
          path: docs/data/chargers.geojson
          retention-days: 1

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download any successful attempt
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: chargers-attempt-*
          path: attempts
          merge-multiple: true

      - name: Download all attempt reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: report-attempt-*
          path: reports
          merge-multiple: true

      - name: Build IP success/failure summary
        if: always()
        run: |
          {
            echo "### 이번 실행 IP별 결과"
            echo ""
            echo "| Attempt | IP | 결과 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          success_count=0
          total_count=0
          if [ -d reports ]; then
            for f in $(ls reports/report-*.json 2>/dev/null | sort -t- -k2 -n); do
              attempt=$(jq -r '.attempt' "$f")
              ip=$(jq -r '.ip' "$f")
              outcome=$(jq -r '.outcome' "$f")
              total_count=$((total_count + 1))
              if [ "$outcome" = "success" ]; then
                mark="✅ 성공"
                success_count=$((success_count + 1))
              else
                mark="❌ 실패"
              fi
              echo "| $attempt | $ip | $mark |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          if [ "$total_count" -eq 0 ]; then
            echo "| - | (리포트 없음) | - |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**${success_count} / ${total_count} 성공**" >> "$GITHUB_STEP_SUMMARY"

      - name: Use a successful attempt if available
        id: pick
        run: |
          if [ -f "attempts/chargers.geojson" ]; then
            echo "성공한 시도를 찾았습니다. chargers.geojson을 교체합니다."
            mkdir -p docs/data
            cp attempts/chargers.geojson docs/data/chargers.geojson
            echo "any_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "3번의 시도 모두 API 호출에 실패했습니다. 기존 chargers.geojson을 그대로 둡니다."
            echo "any_success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.pick.outputs.any_success == 'true'
        run: |
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chargers.geojson
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: charger status delta update [$KST_TIME KST]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Fail job if every attempt was blocked
        if: steps.pick.outputs.any_success == 'false'
        run: |
          echo "::error::3번의 병렬 시도 모두 API 호출에 실패했습니다."
          exit 1
