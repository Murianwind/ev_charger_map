name: Update EV Charger Status (delta)

on:
  workflow_dispatch: {}

# 러너가 한동안(예: 도커 데스크탑 재시작 등으로) 오프라인이면, 10분마다
# 오는 dispatch가 대기열에 계속 쌓인다. 같은 concurrency 그룹으로 묶으면,
# 새 실행이 대기열에 들어올 때 "아직 시작 안 한(대기 중)" 이전 실행은
# 자동으로 취소되고 최신 것 하나만 남는다 — 밀린 걸 다 처리할 필요 없이
# 최신 상태만 반영하면 되는 델타 갱신 특성과도 잘 맞는다.
concurrency:
  group: update-status

permissions:
  contents: write

jobs:
  update-status:
    runs-on: [self-hosted, home-pc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch status delta
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          EV_STATUS_PERIOD_MIN: "10"
        run: python scripts/fetch_status.py

      - name: Commit status changes
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          EV_STATUS_PERIOD_MIN: "10"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chargers.geojson
          git diff --cached --quiet && { echo "변경 없음, 커밋 생략"; exit 0; }
          git commit -m "chore: charger status delta update"

          if ! git push origin HEAD:main; then
            echo "push 거부됨 — 우리 파일을 그대로 다시 밀어넣으면 그 사이 다른"
            echo "실행(예: 전체 지역 갱신)이 반영한 내용을 덮어써버릴 수 있다."
            echo "그래서 최신 상태를 새로 받아와 스크립트를 처음부터 다시 돌린다."
            git fetch origin main
            git reset --hard origin/main
            python scripts/fetch_status.py
            git add docs/data/chargers.geojson
            git diff --cached --quiet && { echo "변경 없음, 커밋 생략"; exit 0; }
            git commit -m "chore: charger status delta update"
            git push origin HEAD:main
          fi
