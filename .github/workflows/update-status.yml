name: Update EV Charger Status (delta)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-status:
    runs-on: [self-hosted, home-pc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch status delta
        env:
          EV_SERVICE_KEY: ${{ secrets.EV_SERVICE_KEY }}
          EV_STATUS_PERIOD_MIN: "60"
        run: python scripts/fetch_status.py

      - name: Commit status changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/chargers.geojson
          git diff --cached --quiet || git commit -m "chore: charger status delta update"
          git fetch origin main
          git rebase origin/main -X ours || git rebase --abort
          git push
